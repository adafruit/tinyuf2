repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.4.0
  hooks:
  - id: check-yaml
  - id: trailing-whitespace
    exclude: |
      (?x)^(
        lib/|
        ports/espressif/components/bootloader/subproject/components
      )
  - id: end-of-file-fixer
    exclude: |
      (?x)^(
        lib/|
        .idea/
      )

- repo: https://github.com/codespell-project/codespell
  rev: v2.2.4
  hooks:
  - id: codespell
    args: [-w]
    exclude: |
      (?x)^(
        lib/
      )

- repo: local
  hooks:
  - id: claude-tests
    name: agent skill script tests
    entry: python3 -m unittest discover -s .claude/test -p 'test_*.py'
    language: system
    pass_filenames: false
    # a gitlink is tagged a directory, which the default types: [file] drops
    files: ^(\.claude/|\.github/workflows/|ports/|test/hil/|tools/get_deps\.py$|lib/agentrc$)
    types: []
    types_or: [file, directory]
