repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.4.0
  hooks:
  - id: check-yaml
  - id: trailing-whitespace
    exclude: |
      (?x)^(
        lib/|
        ports/espressif/components/bootloader/subproject/components
      )
  - id: end-of-file-fixer
    exclude: |
      (?x)^(
        lib/|
        .idea/
      )

- repo: https://github.com/codespell-project/codespell
  rev: v2.2.4
  hooks:
  - id: codespell
    args: [-w]
    exclude: |
      (?x)^(
        lib/
      )

- repo: local
  hooks:
  - id: gen-boards
    name: supported_boards.md matches the board headers
    entry: python3 tools/gen_boards.py
    language: system
    pass_filenames: false
    files: ^(ports/[^/]+/boards/[^/]+/board\.h|tools/gen_boards\.py|supported_boards\.md)$
  - id: claude-tests
    name: agent skill script tests
    entry: python3 -m unittest discover -s .claude/test -p 'test_*.py'
    language: system
    pass_filenames: false
    files: ^(\.claude/|\.github/workflows/|\.github/actions/|ports/|test/hil/|tools/(get_deps|gen_boards)\.py$)
