name: Build

on:
  # every push to master/main runs pre-commit; set-matrix decides whether it builds
  push:
    branches: [ master, main ]
  # every pull request, whatever its base: the selection decides what it builds
  pull_request:
  repository_dispatch:
  release:
    types:
      - created

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # the claude-tests hook reads lib/uf2's uf2conv.py, lib/agentrc's board-lock helper, the RT1062 SDK source and the
      # STM32F303 and STM32F411 CMSIS headers
      - name: Fetch test inputs
        run: |
          git submodule update --init --depth 1 lib/uf2 lib/agentrc
          python3 tools/get_deps.py mimxrt10xx stm32f3 stm32f4

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  set-matrix:
    needs: pre-commit
    runs-on: ubuntu-latest
    outputs:
      json: ${{ steps.set-matrix-json.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # a push compares against the tip it replaced, which may be any number of commits back
          fetch-depth: ${{ github.event_name == 'push' && '0' || '2' }}

      # a pull request builds the boards its change reaches: HEAD is the merge commit, HEAD^1 the base it merges into.
      # A push builds every board when it changes a build input, else none
      - name: Generate matrix json
        id: set-matrix-json
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          case "${{ github.event_name }}" in
            pull_request) ARGS=(--base HEAD^1) ;;
            push) ARGS=(--push "$BEFORE") ;;
            *) ARGS=() ;;
          esac
          MATRIX_JSON=$(python .github/workflows/ci_set_matrix.py "${ARGS[@]}")
          echo "matrix=$MATRIX_JSON"
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  # ---------------------------------------
  # Build ARM
  # ---------------------------------------
  arm-make:
    needs: set-matrix
    uses: ./.github/workflows/build_util.yml
    strategy:
      fail-fast: false
      matrix:
        port:
        # Alphabetical order
        - 'kinetis_k32l2'
        - 'stm32h7'
        - 'stm32l4'
    with:
      port: ${{ matrix.port }}
      boards: ${{ toJSON(fromJSON(needs.set-matrix.outputs.json)[matrix.port].board) }}
      build-system: 'make'
      toolchain: 'arm-gcc'

  # ---------------------------------------
  # Build ARM with CMake
  # ---------------------------------------
  arm-cmake:
    needs: set-matrix
    uses: ./.github/workflows/build_util.yml
    strategy:
      fail-fast: false
      matrix:
        port:
          # Alphabetical order by family
          - 'lpc55'
          - 'maxim'
          - 'mimxrt10xx'
          - 'samd51'
          - 'stm32f3'
          - 'stm32f4'
          - 'stm32h5'
    with:
      port: ${{ matrix.port }}
      boards: ${{ toJSON(fromJSON(needs.set-matrix.outputs.json)[matrix.port].board) }}
      build-system: 'cmake'
      toolchain: 'arm-gcc'

  # ---------------------------------------
  # Build ESP
  # ---------------------------------------
  espressif:
    needs: set-matrix
    uses: ./.github/workflows/build_util.yml
    secrets: inherit
    with:
      port: 'espressif'
      boards: ${{ toJSON(fromJSON(needs.set-matrix.outputs.json)['espressif'].board) }}
      build-system: 'make'
      toolchain: 'esp-idf'
      toolchain_version: 'v6.1'

  # ---------------------------------------
  # Build RISC-V
  # ---------------------------------------
  riscv:
    if: false
    needs: set-matrix
    uses: ./.github/workflows/build_util.yml
    strategy:
      fail-fast: false
      matrix:
        port:
          # Alphabetical order
          - 'ch32v20x'
    with:
      port: ${{ matrix.port }}
      boards: ${{ toJSON(fromJSON(needs.set-matrix.outputs.json)[matrix.port].board) }}
      build-system: 'make'
      toolchain: 'riscv-gcc'

  # ---------------------------------------
  # Unit testing with ghostfat
  # ---------------------------------------
  ghostfat:
    needs: set-matrix
    uses: ./.github/workflows/build_ghostfat.yml
    with:
        boards: ${{ toJSON(fromJSON(needs.set-matrix.outputs.json)['test_ghostfat'].board) }}
