name: Build

on:
  push:
    paths:
      - 'apps/**'
      - 'lib/**'
      - 'ports/**'
      - 'src/**'
      - '.github/actions/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/build_util.yml'
      - '.github/workflows/build_ghostfat.yml'
      - '.github/workflows/ci_set_matrix.py'
      - 'cmake/**'
      - 'CMakeLists.txt'
  pull_request:
    branches: [ master ]
    paths:
      - 'apps/**'
      - 'lib/**'
      - 'ports/**'
      - 'src/**'
      - '.github/actions/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/build_util.yml'
      - '.github/workflows/build_ghostfat.yml'
      - '.github/workflows/ci_set_matrix.py'
      - 'cmake/**'
      - 'CMakeLists.txt'
  repository_dispatch:
  release:
    types:
      - created

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      json: ${{ steps.set-matrix-json.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # the claude-tests hook reads lib/uf2's uf2conv.py and the RT1062 SDK source
      - name: Fetch test inputs
        run: |
          git submodule update --init lib/uf2
          python3 tools/get_deps.py mimxrt10xx

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

      - name: Generate matrix json
        id: set-matrix-json
        run: |
          MATRIX_JSON=$(python .github/workflows/ci_set_matrix.py)
          echo "matrix=$MATRIX_JSON"
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  # ---------------------------------------
  # Build ARM
  # ---------------------------------------
  arm-make:
    needs: set-matrix
    uses: ./.github/workflows/build_util.yml
    strategy:
      fail-fast: false
      matrix:
        port:
        # Alphabetical order
        - 'kinetis_k32l2'
        - 'lpc55'
        - 'stm32h7'
        - 'stm32l4'
    with:
      port: ${{ matrix.port }}
      boards: ${{ toJSON(fromJSON(needs.set-matrix.outputs.json)[matrix.port].board) }}
      build-system: 'make'
      toolchain: 'arm-gcc'

  # ---------------------------------------
  # Build ARM with CMake
  # ---------------------------------------
  arm-cmake:
    needs: set-matrix
    uses: ./.github/workflows/build_util.yml
    strategy:
      fail-fast: false
      matrix:
        # Alphabetical order by family; ports released from make builds before keep make's file names
        include:
          - port: 'maxim'
          - port: 'mimxrt10xx'
            release-names: 'make'
          - port: 'stm32f3'
            release-names: 'make'
          - port: 'stm32f4'
          - port: 'stm32h5'
    with:
      port: ${{ matrix.port }}
      boards: ${{ toJSON(fromJSON(needs.set-matrix.outputs.json)[matrix.port].board) }}
      build-system: 'cmake'
      toolchain: 'arm-gcc'
      release-names: ${{ matrix.release-names || 'cmake' }}

  # ---------------------------------------
  # Make still builds one board of each CMake-built port with a Makefile (no release assets)
  # ---------------------------------------
  make-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { port: 'mimxrt10xx', board: 'metro_m7_1011' }
          - { port: 'stm32f3', board: 'stm32f303disco' }
          - { port: 'stm32f4', board: 'feather_stm32f405_express' }
          - { port: 'stm32h5', board: 'stm32h563_nucleo' }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Fetch tags
        run: git fetch --tags

      - name: Setup Toolchain
        uses: ./.github/actions/setup_toolchain
        with:
          toolchain: 'arm-gcc'

      - name: Get Dependencies
        run: python tools/get_deps.py --board ${{ matrix.board }}

      - name: Build
        run: |
          set -e
          make -j$(nproc) -C ports/${{ matrix.port }} BOARD=${{ matrix.board }} all self-update
          make -C ports/${{ matrix.port }} BOARD=${{ matrix.board }} copy-artifact
          for app in ports/${{ matrix.port }}/apps/*/; do
            if [ -f "$app/Makefile" ] && [ "$(basename $app)" != self_update ]; then
              make -j$(nproc) -C $app BOARD=${{ matrix.board }} all
            fi
          done

  # ---------------------------------------
  # Build ESP
  # ---------------------------------------
  espressif:
    needs: set-matrix
    uses: ./.github/workflows/build_util.yml
    secrets: inherit
    with:
      port: 'espressif'
      boards: ${{ toJSON(fromJSON(needs.set-matrix.outputs.json)['espressif'].board) }}
      build-system: 'make'
      toolchain: 'esp-idf'
      toolchain_version: 'v6.1'

  # ---------------------------------------
  # Build RISC-V
  # ---------------------------------------
  riscv:
    if: false
    needs: set-matrix
    uses: ./.github/workflows/build_util.yml
    strategy:
      fail-fast: false
      matrix:
        port:
          # Alphabetical order
          - 'ch32v20x'
    with:
      port: ${{ matrix.port }}
      boards: ${{ toJSON(fromJSON(needs.set-matrix.outputs.json)[matrix.port].board) }}
      build-system: 'make'
      toolchain: 'riscv-gcc'

  # ---------------------------------------
  # Unit testing with ghostfat
  # ---------------------------------------
  ghostfat:
    needs: set-matrix
    uses: ./.github/workflows/build_ghostfat.yml
    with:
        boards: ${{ toJSON(fromJSON(needs.set-matrix.outputs.json)['test_ghostfat'].board) }}
