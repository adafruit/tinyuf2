name: HIL

# The battery on the ci.lan rig (.claude/skills/hil-contract/SKILL.md, roster test/hil/ci.json) for the boards a
# pull request's change reaches, built on the rig from its clean checkout. A pull request from a fork never
# reaches the rig. A dispatch runs named boards, with fail_at for the contract's acceptance only.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      board:
        description: roster board(s), space separated
        required: true
      fail_at:
        description: 'acceptance only: fail this battery step or the cleanup (the contract, Execution)'
        required: false
        default: ''

# never cancelled: a battery killed mid-run leaves the board for recovery, so a newer push waits its turn
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      boards: ${{ steps.select.outputs.boards }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # HEAD is the merge commit, HEAD^1 the base it merges into; what no ci.json board can run is reported here,
      # so a skipped rig job never hides it. A dispatch names boards, each checked against the roster.
      - name: Select the boards the change reaches
        id: select
        env:
          BOARD_INPUT: ${{ github.event.inputs.board }}
        shell: bash   # -o pipefail: a failed selection must not become an empty, skipped rig job through tee
        run: |
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, subprocess, sys
          roster = {b['name'] for b in json.load(open('test/hil/ci.json'))['boards']}
          if os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch':
              boards = sorted(set(os.environ['BOARD_INPUT'].split()))
              if not boards or set(boards) - roster:
                  sys.exit(f'not in test/hil/ci.json: {sorted(set(boards) - roster) or "no board"}')
              full, uncovered = False, []
          else:
              sel = subprocess.run([sys.executable, '.claude/skills/build/scripts/check_build.py', '--select-only',
                                    '--base', 'HEAD^1', '--hil-config', 'test/hil/ci.json'], capture_output=True, text=True)
              if sel.returncode:
                  sys.exit(f'selection failed (exit {sel.returncode}): {sel.stdout or sel.stderr}')
              hil = json.loads(sel.stdout)['hil']
              boards, full, uncovered = hil['boards'], hil['full'], hil['uncovered']
          print('boards:', ' '.join(boards) or 'none')
          for u in uncovered:
              print(f'- `{u["target"]}`: {u["reason"]}')
          with open('hil-selection.json', 'w') as f:
              json.dump({'boards': boards, 'full': full, 'uncovered': uncovered}, f)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'boards={" ".join(boards)}\n')
          EOF

      # for the comment job; overwrite: a re-run of every job selects again under the same name
      - name: Upload the selection
        uses: actions/upload-artifact@v4
        with:
          name: hil-selection
          path: hil-selection.json
          overwrite: true

  ci-lan:
    needs: select
    if: needs.select.outputs.boards != ''
    runs-on: [ self-hosted, Linux, X64, tinyuf2 ]
    # one board is a ~2 min build and a ~2 min battery; a locked board waits up to hil_ci.py's --lock-wait
    timeout-minutes: 45
    env:
      BOARDS: ${{ needs.select.outputs.boards }}
      FAIL_AT: ${{ github.event.inputs.fail_at }}
    steps:
      # kept across runs and attempts, outside the workspace: records, every battery's run directory with its report,
      # log and output, and the markers that make a run which ended without a report a blocker for the next (hil_ci.py)
      - name: Set the run directory
        run: echo "HIL_OUT=$(dirname "$GITHUB_WORKSPACE")/hil-state/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Clean workspace
        run: |
          rm -rf "${{ github.workspace }}"
          mkdir -p "${{ github.workspace }}"

      - uses: actions/checkout@v4

      - name: Fetch the build inputs
        run: |
          git submodule update --init --depth 1 lib/tinyusb lib/uf2 lib/agentrc
          for b in $BOARDS; do python3 tools/get_deps.py -b "$b"; done

      - name: Battery on the rig
        run: |
          python3 .claude/skills/hil-contract/scripts/hil_ci.py --board $BOARDS ${FAIL_AT:+--fail-at "$FAIL_AT"} \
            --roster test/hil/ci.json --out "$HIL_OUT"

      # hil_ci.py's decision, written last (upload-views): `upload` only when no report view is unsafe; any other
      # content, no file (hil_ci.py did not finish) or a failed step uploads no hil_report.md at all
      - name: Read the report views' upload decision
        id: views
        if: always()
        run: |
          if [ "$(cat "$HIL_OUT/upload-views" 2>/dev/null)" = upload ]; then
            echo "exclude=" >> "$GITHUB_OUTPUT"
          else
            echo "exclude=!$HIL_OUT/**/hil_report.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the records, reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hil-ci-lan-${{ github.run_attempt }}
          path: |
            ${{ env.HIL_OUT }}
            ${{ steps.views.outputs.exclude }}
            ${{ steps.views.outcome != 'success' && format('!{0}/**/hil_report.md', env.HIL_OUT) || '' }}
          if-no-files-found: ignore

  # the sticky report comment, posted only by the newest attempt of the newest run for the PR's current head, so an
  # older run finishing late never replaces a newer report
  comment:
    needs: [select, ci-lan]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read   # the checkout; a job's permissions replace the workflow's
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the selection
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: hil-selection
          path: hil-selection

      # the rig uploads its HIL_OUT, summary.json at the artifact's root
      - name: Download the records, reports and logs
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: hil-ci-lan-${{ github.run_attempt }}
          path: hil-out

      - name: Check this run is the newest for the PR head
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if why=$(python3 .claude/skills/hil-contract/scripts/hil_comment.py fresh --repo "$GITHUB_REPOSITORY" \
                     --pr "$PR" --head "$HEAD_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"); then
            echo "post=true" >> "$GITHUB_OUTPUT"
          else
            code=$?
            [ "$code" = 1 ] || exit "$code"
            echo "::notice title=HIL report not posted::$why"
          fi

      - name: Render the report
        if: steps.fresh.outputs.post == 'true'
        run: |
          python3 .claude/skills/hil-contract/scripts/hil_comment.py render --summary hil-out/summary.json \
            --selection hil-selection/hil-selection.json --roster ci.json --head "$HEAD_SHA" --tested "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --out comment.md

      - name: Post the report
        if: steps.fresh.outputs.post == 'true'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: hil-report
          path: comment.md
          number: ${{ github.event.pull_request.number }}
