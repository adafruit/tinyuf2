name: HIL
# a pull request's run names its PR: hil_comment.py's fresh tells apart PRs that share a head (RUN_NAME)
run-name: "${{ github.event.pull_request && format('HIL PR #{0}', github.event.pull_request.number) || 'HIL' }}"

# The battery on the ci.lan rig (.claude/skills/hil-contract/SKILL.md, roster test/hil/ci.json) for the commissioned
# boards a pull request's change reaches, each built on a hosted runner (cmake with CI's arm-gcc, or an Espressif board
# in CI's ESP-IDF image) and admitted on the rig against its record and roster (hil_hosted.py): the rig has no
# toolchain and builds nothing. A pull request from a fork never reaches the rig. A dispatch runs named boards, with
# fail_at for the contract's acceptance only, and also builds a named board pending commissioning, whose artifact
# commissioning admits by hand.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      board:
        description: roster board(s), space separated
        required: true
      fail_at:
        description: 'acceptance only: fail this battery step or the cleanup (the contract, Execution)'
        required: false
        default: ''

# never cancelled: a battery killed mid-run leaves the board for recovery, so a newer push waits its turn
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      boards: ${{ steps.select.outputs.boards }}
      hosted: ${{ steps.select.outputs.hosted }}
      hosted_idf: ${{ steps.select.outputs.hosted_idf }}
      hosted_cmake: ${{ steps.select.outputs.hosted_cmake }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # HEAD is the merge commit, HEAD^1 the base it merges into; what no ci.json board can run, and a selected board
      # pending commissioning, is reported here, so a skipped rig job never hides it. A dispatch names boards, each
      # checked against the roster.
      - name: Select the boards the change reaches
        id: select
        env:
          BOARD_INPUT: ${{ github.event.inputs.board }}
        shell: bash   # -o pipefail: a failed selection must not become an empty, skipped rig job through tee
        run: |
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, subprocess, sys
          roster = {b['name'] for b in json.load(open('test/hil/ci.json'))['boards']}
          if os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch':
              boards = sorted(set(os.environ['BOARD_INPUT'].split()))
              if not boards or set(boards) - roster:
                  sys.exit(f'not in test/hil/ci.json: {sorted(set(boards) - roster) or "no board"}')
              full, uncovered = False, []
          else:
              sel = subprocess.run([sys.executable, '.claude/skills/build/scripts/check_build.py', '--select-only',
                                    '--base', 'HEAD^1', '--hil-config', 'test/hil/ci.json'], capture_output=True, text=True)
              if sel.returncode:
                  sys.exit(f'selection failed (exit {sel.returncode}): {sel.stdout or sel.stderr}')
              hil = json.loads(sel.stdout)['hil']
              boards, full, uncovered = hil['boards'], hil['full'], hil['uncovered']
          sys.path.insert(0, '.claude/skills/hil-contract/scripts')
          import hil_ci
          rig, hosted, pending = hil_ci.split('test/hil/ci.json', boards,
                                              os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch')
          uncovered += [{'target': b, 'reason': 'pending commissioning (no tinyuf2.reentry): not run'} for b in pending]
          print('boards:', ' '.join(rig) or 'none')
          print('hosted builds:', ' '.join(hosted) or 'none')
          for u in uncovered:
              print(f'- `{u["target"]}`: {u["reason"]}')
          with open('hil-selection.json', 'w') as f:
              json.dump({'boards': rig, 'full': full, 'uncovered': uncovered}, f)
          idf = [b for b in hosted if hil_ci.espressif(b)]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'boards={" ".join(rig)}\nhosted={" ".join(hosted)}\n'
                      f'hosted_idf={" ".join(idf)}\nhosted_cmake={" ".join(b for b in hosted if b not in idf)}\n')
          EOF

      # for the comment job; overwrite: a re-run of every job selects again under the same name
      - name: Upload the selection
        uses: actions/upload-artifact@v4
        with:
          name: hil-selection
          path: hil-selection.json
          overwrite: true

  # each board's CI record is built here, packed with the roster it was built against for the rig to admit: cmake with
  # the arm-gcc build.yml's release builds install, an Espressif board in CI's image (build.yml's toolchain_version)
  hosted-build:
    needs: select
    if: needs.select.outputs.hosted != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # the attempt whose artifact the rig admits: a re-run that does not re-run this job keeps it, and one that does
    # never sees an earlier attempt's builds, even when it packs nothing
    outputs:
      attempt: ${{ github.run_attempt }}
    env:
      HOSTED_CMAKE: ${{ needs.select.outputs.hosted_cmake }}
      HOSTED_IDF: ${{ needs.select.outputs.hosted_idf }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the build inputs
        run: |
          git submodule update --init --depth 1 lib/tinyusb lib/uf2 lib/agentrc
          python3 tools/get_deps.py $(printf -- '-b %s ' $HOSTED_CMAKE $HOSTED_IDF)

      # each backend's preparation fails only its own boards (the build step below): the other's still build and go up
      # hil_hosted.py admits a cmake record only from the release this installs (setup_toolchain's)
      - name: Set up arm-gcc
        id: arm-gcc
        if: env.HOSTED_CMAKE != ''
        continue-on-error: true
        uses: ./.github/actions/setup_toolchain
        with:
          toolchain: arm-gcc

      - name: Pull CI's ESP-IDF image
        id: idf
        if: env.HOSTED_IDF != ''
        continue-on-error: true
        run: docker pull "$(python3 .claude/skills/hil-contract/scripts/hil_hosted.py image)"

      # every board is tried; one whose backend's preparation or build failed packs nothing and fails the job once the
      # rest are packed
      - name: Build and pack each record
        env:
          CMAKE_READY: ${{ steps.arm-gcc.outcome }}
          IDF_READY: ${{ steps.idf.outcome }}
        run: |
          failed=
          build() {   # whether the backend is ready, then its boards
            ready=$1
            shift
            for b in "$@"; do
              if [ "$ready" = success ] &&
                 python3 .claude/skills/hil-contract/scripts/hil_hosted.py build --board "$b" --roster test/hil/ci.json \
                   --out "$RUNNER_TEMP/hil-hosted"; then
                continue
              fi
              failed="$failed $b"
            done
          }
          build "$CMAKE_READY" $HOSTED_CMAKE
          build "$IDF_READY" $HOSTED_IDF
          if [ -n "$failed" ]; then
            echo "::error title=Hosted build failed::$failed"
            exit 1
          fi

      # what did build goes up after a failure too
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: hil-hosted-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hil-hosted
          if-no-files-found: ignore

  # a board whose hosted build failed is not-run here (no artifact to admit); the rest still run
  ci-lan:
    needs: [select, hosted-build]
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.boards != '' }}
    runs-on: [ self-hosted, Linux, X64, tinyuf2 ]
    # one board is a ~2 min battery; a locked board waits up to hil_ci.py's --lock-wait
    timeout-minutes: 45
    # the attempt that uploaded the artifact: a re-run of failed jobs that does not re-run this job keeps its outputs
    outputs:
      attempt: ${{ github.run_attempt }}
    env:
      BOARDS: ${{ needs.select.outputs.boards }}
      FAIL_AT: ${{ github.event.inputs.fail_at }}
    steps:
      # kept across runs and attempts, outside the workspace: records, every battery's run directory with its report,
      # log and output, and the markers that make a run which ended without a report a blocker for the next (hil_ci.py)
      - name: Set the run directory
        run: echo "HIL_OUT=$(dirname "$GITHUB_WORKSPACE")/hil-state/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Clean workspace
        run: |
          rm -rf "${{ github.workspace }}"
          mkdir -p "${{ github.workspace }}"

      # the rig keeps state between jobs: no token stays in its checkout
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # what admission compares each record's identity with
      - name: Fetch the build inputs
        run: |
          git submodule update --init --depth 1 lib/tinyusb lib/uf2 lib/agentrc
          python3 tools/get_deps.py $(printf -- '-b %s ' $BOARDS)

      # the latest hosted-build attempt's; none when its every build failed: each board is then not-run
      - name: Fetch the hosted builds
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: hil-hosted-build-${{ needs.hosted-build.outputs.attempt || github.run_attempt }}
          path: ${{ runner.temp }}/hil-hosted

      - name: Battery on the rig
        run: |
          python3 .claude/skills/hil-contract/scripts/hil_ci.py --board $BOARDS ${FAIL_AT:+--fail-at "$FAIL_AT"} \
            --roster test/hil/ci.json --out "$HIL_OUT" --hosted "$RUNNER_TEMP/hil-hosted"

      # hil_ci.py's decision, written last (upload-views): `upload` only when no report view is unsafe; any other
      # content, no file (hil_ci.py did not finish) or a failed step uploads no hil_report.md at all
      - name: Read the report views' upload decision
        id: views
        if: always()
        run: |
          if [ "$(cat "$HIL_OUT/upload-views" 2>/dev/null)" = upload ]; then
            echo "exclude=" >> "$GITHUB_OUTPUT"
          else
            echo "exclude=!$HIL_OUT/**/hil_report.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the records, reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hil-ci-lan-${{ github.run_attempt }}
          path: |
            ${{ env.HIL_OUT }}
            ${{ steps.views.outputs.exclude }}
            ${{ steps.views.outcome != 'success' && format('!{0}/**/hil_report.md', env.HIL_OUT) || '' }}
          if-no-files-found: ignore

  # the sticky report comment, posted only by the newest attempt of the newest run for the PR's current head, so an
  # older run finishing late never replaces a newer report
  comment:
    needs: [select, ci-lan]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read   # the checkout; a job's permissions replace the workflow's
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # the attempt the rig job last ran in, whose artifact this is; this attempt when the rig job was skipped
      RIG_ATTEMPT: ${{ needs.ci-lan.outputs.attempt || github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the selection
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: hil-selection
          path: hil-selection

      - name: Check this run is the newest for the PR head
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if why=$(python3 .claude/skills/hil-contract/scripts/hil_comment.py fresh --repo "$GITHUB_REPOSITORY" \
                     --pr "$PR" --head "$HEAD_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"); then
            echo "post=true" >> "$GITHUB_OUTPUT"
          else
            code=$?
            [ "$code" = 1 ] || exit "$code"
            echo "::notice title=HIL report not posted::$why"
          fi

      # the rig uploads its HIL_OUT, summary.json at the artifact's root
      - name: Download the records, reports and logs
        if: steps.fresh.outputs.post == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: hil-ci-lan-${{ env.RIG_ATTEMPT }}
          path: hil-out

      - name: Render the report
        if: steps.fresh.outputs.post == 'true'
        run: |
          python3 .claude/skills/hil-contract/scripts/hil_comment.py render --summary hil-out/summary.json \
            --selection hil-selection/hil-selection.json --views hil-out/upload-views --roster ci.json \
            --head "$HEAD_SHA" --tested "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$RIG_ATTEMPT" \
            --run-id "$GITHUB_RUN_ID" --attempt "$RIG_ATTEMPT" --out comment.md

      - name: Post the report
        if: steps.fresh.outputs.post == 'true'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: hil-report
          path: comment.md
          number: ${{ github.event.pull_request.number }}
