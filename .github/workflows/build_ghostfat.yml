name: Testing ghostfat

on:
  workflow_call:
    inputs:
      boards:
        required: true
        type: string

jobs:
  board:
    # a pull request's selection can leave a port no boards, and an empty matrix is an error
    if: fromJSON(inputs.boards)[0] != null
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(inputs.boards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # msc_test.c compiles src/msc.c, which includes tusb.h
      - name: Fetch TinyUSB
        run: git submodule update --init --depth 1 lib/tinyusb

      - name: Build and execute native self-test
        run: |
          cmake -B build -G Ninja -DBOARD=${{ matrix.board }} ports/test_ghostfat
          cmake --build build --target selftest

      - name: Compress (double) newly generated self-test image
        run: |
          mv ghostfat.img ghostfat_${{ matrix.board }}.img
          gzip --keep ghostfat_${{ matrix.board }}.img
          gzip --keep --force --best ghostfat_${{ matrix.board }}.img.gz
        working-directory: build

      - name: Save newly generated self-test images as CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghostfat_${{ matrix.board }}_image
          path: ./build/ghostfat_${{ matrix.board }}.img.gz.gz
