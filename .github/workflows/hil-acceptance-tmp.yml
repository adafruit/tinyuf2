name: HIL acceptance (temporary)

# removed before the PR: hil.yml's rig job on a push to this branch, failing at cleanup
on:
  push:
    branches: [ hil-ci-runner ]

concurrency:
  group: hil-acceptance
  cancel-in-progress: false

jobs:
  ci-lan:
    runs-on: [ self-hosted, Linux, X64, tinyuf2 ]
    # one board is a ~2 min build and a ~2 min battery; a locked board waits up to hil_ci.py's --lock-wait
    timeout-minutes: 45
    env:
      BOARDS: imxrt1064_evk
      FAIL_AT: ""
    steps:
      # kept across runs and attempts, outside the workspace: records, every attempt's output, reports and logs, and
      # the markers that make a run which ended without a report a blocker for the next (hil_ci.py). A battery's
      # own run dir in the old workspace (hil.log of a killed run) is moved there before the workspace goes.
      - name: Set the run directory and keep the last workspace's run dirs
        run: |
          STATE="$(dirname "$GITHUB_WORKSPACE")/hil-state"
          mkdir -p "$STATE/orphans"
          mv "$GITHUB_WORKSPACE"/cmake-build/hil/run-* "$STATE/orphans/" 2>/dev/null || true
          echo "HIL_OUT=$STATE/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Clean workspace
        run: |
          rm -rf "${{ github.workspace }}"
          mkdir -p "${{ github.workspace }}"

      - uses: actions/checkout@v4

      - name: Fetch the build inputs
        run: |
          git submodule update --init --depth 1 lib/tinyusb lib/uf2 lib/agentrc
          for b in $BOARDS; do python3 tools/get_deps.py -b "$b"; done

      - name: Battery on the rig
        run: |
          set --
          for b in $BOARDS; do set -- "$@" --board "$b"; done
          if [ -n "$FAIL_AT" ]; then set -- "$@" --fail-at "$FAIL_AT"; fi
          python3 .claude/skills/hil-contract/scripts/hil_ci.py "$@" --roster test/hil/ci.json --out "$HIL_OUT"

      - name: Upload the records, reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hil-ci-lan-${{ github.run_attempt }}
          path: ${{ env.HIL_OUT }}
          if-no-files-found: ignore
