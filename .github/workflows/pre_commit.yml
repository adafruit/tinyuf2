name: pre-commit

# build.yml runs pre-commit only for firmware paths; this covers the agent files and workflows
on:
  push:
    paths:
      - '.claude/**'
      - 'CLAUDE.md'
      - '.github/workflows/**'
      - '.pre-commit-config.yaml'
      - 'tools/get_deps.py'
      - 'test/hil/**'
  pull_request:
    branches: [ master ]
    paths:
      - '.claude/**'
      - 'CLAUDE.md'
      - '.github/workflows/**'
      - '.pre-commit-config.yaml'
      - 'tools/get_deps.py'
      - 'test/hil/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
