name: pre-commit

# build.yml runs pre-commit on every pull request and on pushes to firmware paths; this covers pushes that change only these
on:
  push:
    branches: [ master, main ]
    paths:
      - '.claude/**'
      - 'CLAUDE.md'
      - '.github/workflows/**'
      - '.pre-commit-config.yaml'
      - 'test/hil/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # the claude-tests hook reads lib/uf2's uf2conv.py, the RT1062 SDK source and the STM32F303 CMSIS header
      - name: Fetch test inputs
        run: |
          git submodule update --init lib/uf2
          python3 tools/get_deps.py mimxrt10xx stm32f3

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
